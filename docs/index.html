
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contribution Analytics | Deekshitha</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #070B16;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .dashboard {
            width: 100%;
            max-width: 1150px;
            padding: 32px;
            border: 1px solid rgba(255, 79, 195, 0.18);
            border-radius: 22px;
            background: linear-gradient(
                145deg,
                #101426,
                #090D1A
            );
            box-shadow:
                0 0 45px rgba(255, 30, 170, 0.07),
                inset 0 0 25px rgba(255, 79, 195, 0.025);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: #FF4FC3;
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(22px, 4vw, 32px);
            letter-spacing: 1px;
        }

        .subtitle {
            color: #8D93A9;
            font-size: 13px;
            margin-top: 9px;
        }

        .total-box {
            text-align: right;
        }

        .total {
            font-size: 34px;
            color: #FF4FC3;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 79, 195, 0.5);
        }

        .total-label {
            color: #858CA4;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .chart-container {
            position: relative;
            height: 430px;
            width: 100%;
        }

        .hover-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            padding: 17px 20px;
            margin-top: 22px;
            border: 1px solid rgba(255, 79, 195, 0.2);
            border-radius: 12px;
            background: rgba(255, 79, 195, 0.045);
        }

        .hover-date {
            color: #A6A9BA;
            font-size: 13px;
        }

        .hover-count {
            color: #FF4FC3;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 79, 195, 0.5);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
            color: #777E96;
            font-size: 11px;
        }

        .loading {
            color: #FF4FC3;
            text-align: center;
            padding: 40px;
        }

        .error {
            color: #FF8AAB;
            padding: 30px;
            text-align: center;
        }

        @media (max-width: 650px) {
            .dashboard {
                padding: 20px 14px;
            }

            .chart-container {
                height: 310px;
            }

            .total-box {
                text-align: left;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <main class="dashboard">

        <header class="top">
            <div>
                <p class="eyebrow">DEEKSHITHA / ANALYTICS</p>
                <h1>Contribution Activity</h1>
                <p class="subtitle">
                    A year of consistency, one day at a time.
                </p>
            </div>

            <div class="total-box">
                <div class="total" id="totalCount">--</div>
                <div class="total-label">TOTAL CONTRIBUTIONS</div>
            </div>
        </header>

        <div id="loading" class="loading">
            Loading contribution data...
        </div>

        <div id="error" class="error" hidden>
            Unable to load contribution data.
        </div>

        <section class="chart-container" id="chartContainer" hidden>
            <canvas id="contributionChart"></canvas>
        </section>

        <section class="hover-info" id="hoverInfo" hidden>
            <div class="hover-date" id="hoverDate">
                Hover over the graph
            </div>

            <div class="hover-count" id="hoverCount">
                -- contributions
            </div>
        </section>

        <footer class="footer">
            <span>365-DAY CONTRIBUTION HISTORY</span>
            <span>POWERED BY GITHUB GRAPHQL</span>
        </footer>

    </main>

    <script>
        const neonPlugin = {
            id: "neonPlugin",

            beforeDatasetsDraw(chart) {
                const { ctx } = chart;
                const dataset = chart.getDatasetMeta(0);

                if (!dataset || !dataset.data.length) return;

                ctx.save();

                ctx.shadowColor = "#FF4FC3";
                ctx.shadowBlur = 18;

                ctx.strokeStyle = "#FF4FC3";
                ctx.lineWidth = 2.5;

                ctx.beginPath();

                dataset.data.forEach((point, index) => {
                    const position = point.getProps(
                        ["x", "y"],
                        true
                    );

                    if (index === 0) {
                        ctx.moveTo(position.x, position.y);
                    } else {
                        ctx.lineTo(position.x, position.y);
                    }
                });

                ctx.stroke();
                ctx.restore();
            },

            afterDatasetsDraw(chart) {
                const active = chart.tooltip?.getActiveElements();

                if (!active || !active.length) return;

                const { ctx, chartArea } = chart;
                const point = active[0].element;

                ctx.save();

                // Vertical guide follows the selected point
                ctx.beginPath();
                ctx.setLineDash([5, 6]);
                ctx.moveTo(point.x, chartArea.top);
                ctx.lineTo(point.x, chartArea.bottom);
                ctx.strokeStyle = "rgba(255, 79, 195, 0.65)";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Glowing selected point
                ctx.setLineDash([]);
                ctx.shadowColor = "#FF4FC3";
                ctx.shadowBlur = 22;
                ctx.fillStyle = "#FFFFFF";

                ctx.beginPath();
                ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        };

        async function loadContributions() {
            const loading = document.getElementById("loading");
            const error = document.getElementById("error");
            const container = document.getElementById("chartContainer");
            const hoverInfo = document.getElementById("hoverInfo");

            try {
                const response = await fetch("./contributions.json");

                if (!response.ok) {
                    throw new Error("Could not fetch contribution data.");
                }

                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error("Contribution data is empty.");
                }

                const labels = data.map(item => item.date);
                const counts = data.map(item => item.count);

                const total = counts.reduce(
                    (sum, count) => sum + count,
                    0
                );

                document.getElementById("totalCount").textContent =
                    total.toLocaleString();

                loading.hidden = true;
                container.hidden = false;
                hoverInfo.hidden = false;

                const ctx = document
                    .getElementById("contributionChart")
                    .getContext("2d");

                const gradient = ctx.createLinearGradient(
                    0,
                    0,
                    0,
                    430
                );

                gradient.addColorStop(
                    0,
                    "rgba(255, 79, 195, 0.36)"
                );

                gradient.addColorStop(
                    0.55,
                    "rgba(255, 79, 195, 0.12)"
                );

                gradient.addColorStop(
                    1,
                    "rgba(255, 79, 195, 0.005)"
                );

                const chart = new Chart(ctx, {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "Contributions",
                            data: counts,

                            borderColor: "#FF4FC3",
                            backgroundColor: gradient,

                            fill: true,
                            tension: 0.28,

                            borderWidth: 2.5,

                            pointRadius: 0,
                            pointHoverRadius: 7,

                            pointBackgroundColor: "#FFFFFF",
                            pointBorderColor: "#FF4FC3",
                            pointBorderWidth: 3,

                            pointHoverBackgroundColor: "#FFFFFF",
                            pointHoverBorderColor: "#FF4FC3",
                            pointHoverBorderWidth: 4
                        }]
                    },

                    plugins: [neonPlugin],

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,

                        interaction: {
                            mode: "index",
                            intersect: false
                        },

                        animation: {
                            duration: 1200,
                            easing: "easeOutQuart"
                        },

                        plugins: {
                            legend: {
                                display: false
                            },

                            tooltip: {
                                enabled: true,

                                backgroundColor: "#171126",
                                borderColor: "#FF4FC3",
                                borderWidth: 1,

                                titleColor: "#FF8ADD",
                                bodyColor: "#FFFFFF",

                                padding: 14,
                                displayColors: false,

                                titleFont: {
                                    size: 13,
                                    weight: "bold"
                                },

                                bodyFont: {
                                    size: 14,
                                    weight: "bold"
                                },

                                callbacks: {
                                    title(items) {
                                        const date = new Date(
                                            items[0].label + "T00:00:00"
                                        );

                                        return date.toLocaleDateString(
                                            "en-IN",
                                            {
                                                day: "numeric",
                                                month: "long",
                                                year: "numeric"
                                            }
                                        );
                                    },

                                    label(context) {
                                        const count = context.parsed.y;

                                        return count +
                                            (count === 1
                                                ? " contribution"
                                                : " contributions");
                                    }
                                }
                            }
                        },

                        scales: {
                            x: {
                                grid: {
                                    display: false
                                },

                                ticks: {
                                    color: "#9298AD",
                                    maxTicksLimit: 12,
                                    maxRotation: 0
                                },

                                border: {
                                    display: false
                                }
                            },

                            y: {
                                beginAtZero: true,

                                suggestedMax: 5,

                                grid: {
                                    color: "rgba(180, 150, 190, 0.10)",
                                    drawTicks: false
                                },

                                ticks: {
                                    color: "#9298AD",
                                    precision: 0,
                                    padding: 12
                                },

                                border: {
                                    display: false
                                }
                            }
                        },

                        onHover(event, activeElements, chart) {
                            if (activeElements.length > 0) {
                                const index = activeElements[0].index;
                                const item = data[index];

                                const date = new Date(
                                    item.date + "T00:00:00"
                                );

                                document.getElementById("hoverDate")
                                    .textContent =
                                    date.toLocaleDateString("en-IN", {
                                        day: "numeric",
                                        month: "long",
                                        year: "numeric"
                                    });

                                document.getElementById("hoverCount")
                                    .textContent =
                                    item.count +
                                    (item.count === 1
                                        ? " contribution"
                                        : " contributions");
                            } else {
                                document.getElementById("hoverDate")
                                    .textContent =
                                    "Move your cursor over the graph";

                                document.getElementById("hoverCount")
                                    .textContent = "-- contributions";
                            }
                        }
                    }
                });

            } catch (err) {
                console.error(err);

                loading.hidden = true;
                error.hidden = false;
                error.textContent =
                    "Unable to load contribution data. Please try again later.";
            }
        }

        loadContributions();
    </script>

</body>
</html>
