name: Generate pink contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Deekshitha-089
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff4fc3&color_dots=#100714,#4a1241,#a61d82,#ff4fc3,#ffc0f0
            dist/github-contribution-grid-snake-dark.svg?color_snake=ff4fc3&color_dots=#100714,#4a1241,#a61d82,#ff4fc3,#ffc0f0
      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
